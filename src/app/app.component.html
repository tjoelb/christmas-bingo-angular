<mat-drawer-container class="main">
    <mat-drawer mode="side" opened>
        <div style="display: flex; flex-direction: column">
            <button
                style="margin: 10px"
                matButton="elevated"
                (click)="start()"
                matTooltip="This starts the bingo caller!"
            >
                Start
            </button>
            <button
                style="margin: 10px"
                matButton="elevated"
                (click)="stop()"
                matTooltip="This stops the bingo caller!"
            >
                Stop
            </button>
        </div>
    </mat-drawer>
    <mat-drawer-content>
        <!-- B -->
        <table mat-table [dataSource]="bDataSource" class="mat-elevation-z8">
            <mat-text-column name="b"></mat-text-column>

            <tr mat-header-row *matHeaderRowDef="bDisplayedColumns"></tr>
            <tr
                mat-row
                *matRowDef="let row; columns: bDisplayedColumns"
                (click)="sayRow('B ' + row.b)"
                [class.highlight-called]="called.includes(row.b)"
            ></tr>
        </table>
        <mat-divider [vertical]="true"></mat-divider>

        <!-- I -->
        <table mat-table [dataSource]="iDataSource" class="mat-elevation-z8">
            <mat-text-column name="i"></mat-text-column>

            <tr mat-header-row *matHeaderRowDef="iDisplayedColumns"></tr>
            <tr
                mat-row
                *matRowDef="let row; columns: iDisplayedColumns"
                (click)="sayRow('I ' + row.i)"
                [class.highlight-called]="called.includes(row.i)"
            ></tr>
        </table>
        <mat-divider [vertical]="true"></mat-divider>

        <!-- N -->
        <table mat-table [dataSource]="nDataSource" class="mat-elevation-z8">
            <mat-text-column name="n"></mat-text-column>

            <tr mat-header-row *matHeaderRowDef="nDisplayedColumns"></tr>
            <tr
                mat-row
                *matRowDef="let row; columns: nDisplayedColumns"
                (click)="sayRow('N ' + row.n)"
                [class.highlight-called]="called.includes(row.n)"
            ></tr>
        </table>
        <mat-divider [vertical]="true"></mat-divider>

        <!-- G -->
        <table mat-table [dataSource]="gDataSource" class="mat-elevation-z8">
            <mat-text-column name="g"></mat-text-column>

            <tr mat-header-row *matHeaderRowDef="gDisplayedColumns"></tr>
            <tr
                mat-row
                *matRowDef="let row; columns: gDisplayedColumns"
                (click)="sayRow('G ' + row.g)"
                [class.highlight-called]="called.includes(row.g)"
            ></tr>
        </table>
        <mat-divider [vertical]="true"></mat-divider>

        <!-- O -->
        <table mat-table [dataSource]="oDataSource" class="mat-elevation-z8">
            <mat-text-column name="o"></mat-text-column>

            <tr mat-header-row *matHeaderRowDef="oDisplayedColumns"></tr>
            <tr
                mat-row
                *matRowDef="let row; columns: oDisplayedColumns"
                (click)="sayRow('O ' + row.o)"
                [class.highlight-called]="called.includes(row.o)"
            ></tr>
        </table>
        <mat-divider [vertical]="true"></mat-divider>

        <div
            style="
                display: flex;
                flex-direction: column;
                align-items: center;
                width: -webkit-fill-available;
            "
        >
            <h1>Current number:</h1>
            <div class="circle" [style.background-color]="ballColor">
                <span
                    ><h1 style="margin: 0px">
                        {{ currentCall.split(" ")[0] }}
                    </h1></span
                >
                <span
                    ><h1 style="margin: 0px">
                        {{ currentCall.split(" ")[1] }}
                    </h1></span
                >
            </div>
        </div>
        <!-- <div>Previous number: {{ previousCall }}</div> -->
    </mat-drawer-content>
</mat-drawer-container>
